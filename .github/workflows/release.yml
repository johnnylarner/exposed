name: Build and release exposed

on:
  push:
    branches: [main]
    paths:
      - exposed/**
      - Cargo.toml
      - Cargo.lock
      - .sqlx/**
      - db/migrations/**
      - sqlx.toml
      - frontend/**
      - docker/**
      - .dockerignore
      - .github/workflows/release.yml

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: metadata
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Allocate release tag
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while true; do
            tag=$(date -u +%Y.%m.%d.%H.%M)
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              break
            fi
            refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
            jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null
            while [ "$(date -u +%Y.%m.%d.%H.%M)" = "$tag" ]; do
              sleep "$((60 - 10#$(date -u +%S)))"
            done
          done
      - name: Build binary
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: binary
        with:
          context: .
          file: docker/Dockerfile
          target: binary
          platforms: linux/amd64
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ format('{0}:{1}', steps.metadata.outputs.image, steps.release-tag.outputs.tag) }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Build frontend-server
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: frontend-server
        with:
          context: .
          file: docker/Dockerfile
          target: frontend-server
          platforms: linux/amd64
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ format('{0}:{1}-frontend-server', steps.metadata.outputs.image, steps.release-tag.outputs.tag) }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Build migrate
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: migrate
        with:
          context: .
          file: docker/Dockerfile
          target: migrate
          platforms: linux/amd64
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ format('{0}:{1}-migrate', steps.metadata.outputs.image, steps.release-tag.outputs.tag) }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Build data
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: data
        with:
          context: .
          file: docker/Dockerfile
          target: data
          platforms: linux/amd64
          provenance: mode=max
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: true
          tags: ${{ format('{0}:{1}-data', steps.metadata.outputs.image, steps.release-tag.outputs.tag) }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Write immutable references
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          VERSION: ${{ steps.release-tag.outputs.tag }}
          BINARY_DIGEST: ${{ steps.binary.outputs.digest }}
          FRONTEND_SERVER_DIGEST: ${{ steps.frontend-server.outputs.digest }}
          MIGRATE_DIGEST: ${{ steps.migrate.outputs.digest }}
          DATA_DIGEST: ${{ steps.data.outputs.digest }}
        run: |
          jq -n --arg version "$VERSION" --arg source "$GITHUB_SHA" \
            --arg binary "$IMAGE@$BINARY_DIGEST" \
            --arg frontend_server "$IMAGE@$FRONTEND_SERVER_DIGEST" \
            --arg migrate "$IMAGE@$MIGRATE_DIGEST" --arg data "$IMAGE@$DATA_DIGEST" \
            '{version: $version, source: $source, images: {binary: $binary, "frontend-server": $frontend_server, migrate: $migrate, data: $data}}' > images.json
          printf '%s@%s\n' "$IMAGE" "$BINARY_DIGEST" > image.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-tag.outputs.tag }}
          files: |
            image.txt
            images.json
          fail_on_unmatched_files: true
          body: |
            Source: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Download images.json for the immutable pull references of all four images.

            | Variant | Image |
            | --- | --- |
            | Binary | `${{ steps.metadata.outputs.image }}:${{ steps.release-tag.outputs.tag }}` |
            | Frontend and server | `${{ steps.metadata.outputs.image }}:${{ steps.release-tag.outputs.tag }}-frontend-server` |
            | Migrations | `${{ steps.metadata.outputs.image }}:${{ steps.release-tag.outputs.tag }}-migrate` |
            | Data CLI | `${{ steps.metadata.outputs.image }}:${{ steps.release-tag.outputs.tag }}-data` |

            ```sh
            docker run --rm --env DATABASE_URL -p 6999:6999 ${{ steps.metadata.outputs.image }}@${{ steps.binary.outputs.digest }}
            ```
