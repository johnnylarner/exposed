name: Build and release exposed

on:
  push:
    branches: [main]
    paths: &build-paths
      - exposed/**
      - Cargo.toml
      - Cargo.lock
      - .sqlx/**
      - db/migrations/**
      - sqlx.toml
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: exposed-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.metadata.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: metadata
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.image }}:run-${{ github.run_id }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Smoke test the runtime image
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}:run-${{ github.run_id }}
        run: docker run --rm "$IMAGE" --help

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish timestamp image and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ needs.build.outputs.image }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          marker="<!-- exposed-release-run:${GITHUB_RUN_ID} -->"
          releases=$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases")
          if jq -e --arg marker "$marker" 'any(.[][]; .draft == false and ((.body // "") | contains($marker)))' <<< "$releases" > /dev/null; then
            echo "This Actions run already has a published release."
            exit 0
          fi

          while true; do
            tag=$(date -u +%Y.%m.%d.%H.%M)
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"; then
              break
            fi
            refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
            jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null
            while [ "$(date -u +%Y.%m.%d.%H.%M)" = "$tag" ]; do
              sleep "$((60 - 10#$(date -u +%S)))"
            done
          done

          reference="$IMAGE@$IMAGE_DIGEST"
          docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$tag" "$reference"
          published_digest=$(docker buildx imagetools inspect "$IMAGE:$tag" --format '{{json .Manifest}}' | jq -r .digest)
          test "$published_digest" = "$IMAGE_DIGEST"

          printf '%s\n' "$reference" > image.txt
          printf 'Source: https://github.com/%s/commit/%s\n\nImage: %s:%s\n\nPinned image: %s\n\n    docker run --rm --env DATABASE_URL -p 6999:6999 %s\n\n%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$IMAGE" "$tag" "$reference" "$reference" "$marker" > release-notes.md
          gh release create "$tag" image.txt --repo "$GITHUB_REPOSITORY" \
            --verify-tag --target "$GITHUB_SHA" --title "$tag" --notes-file release-notes.md
