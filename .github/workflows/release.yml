name: Build and release exposed

on:
  push:
    branches: [main]
    paths: &build-paths
      - exposed/**
      - Cargo.toml
      - Cargo.lock
      - .sqlx/**
      - db/migrations/**
      - sqlx.toml
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
  pull_request:
    paths: *build-paths

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set image name
        id: metadata
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Allocate release tag
        if: github.event_name == 'push'
        id: release-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          while true; do
            tag=$(date -u +%Y.%m.%d.%H.%M)
            if gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              break
            fi
            refs=$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$tag")
            jq -e --arg ref "refs/tags/$tag" 'any(.[]; .ref == $ref)' <<< "$refs" > /dev/null
            while [ "$(date -u +%Y.%m.%d.%H.%M)" = "$tag" ]; do
              sleep "$((60 - 10#$(date -u +%S)))"
            done
          done
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && format('{0}:{1}', steps.metadata.outputs.image, steps.release-tag.outputs.tag) || 'exposed:pr' }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Smoke test the runtime image
        env:
          IMAGE: ${{ github.event_name == 'push' && format('{0}:{1}', steps.metadata.outputs.image, steps.release-tag.outputs.tag) || 'exposed:pr' }}
        run: docker run --rm "$IMAGE" --help
      - name: Write immutable image reference
        if: github.event_name == 'push'
        env:
          IMAGE: ${{ steps.metadata.outputs.image }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: printf '%s@%s\n' "$IMAGE" "$IMAGE_DIGEST" > image.txt
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: github.event_name == 'push'
        with:
          tag_name: ${{ steps.release-tag.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release-tag.outputs.tag }}
          files: image.txt
          fail_on_unmatched_files: true
          body: |
            Source: https://github.com/${{ github.repository }}/commit/${{ github.sha }}

            Image: `${{ steps.metadata.outputs.image }}:${{ steps.release-tag.outputs.tag }}`

            Pinned image: `${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}`

            ```sh
            docker run --rm --env DATABASE_URL -p 6999:6999 ${{ steps.metadata.outputs.image }}@${{ steps.build.outputs.digest }}
            ```
