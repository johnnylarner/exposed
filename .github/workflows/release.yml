name: Build and release exposed

on:
  push:
    branches: [main]
    paths: &build-paths
      - exposed/**
      - Cargo.toml
      - Cargo.lock
      - .sqlx/**
      - db/migrations/**
      - sqlx.toml
      - docker/Dockerfile
      - .dockerignore
      - .github/workflows/release.yml
      - scripts/publish-release.py
      - scripts/test-publish-release.py
  pull_request:
    paths: *build-paths

permissions:
  contents: read

concurrency:
  group: exposed-release-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.release.outputs.digest || steps.build.outputs.digest }}
    services:
      postgres:
        image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
        env:
          POSTGRES_USER: exposed
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: exposed_ci
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U exposed -d exposed_ci"
          --health-interval 2s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: 1.98.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: sqlx-metadata
      - name: Check SQLx metadata against the migrated schema
        env:
          DATABASE_URL: postgresql://exposed:ci-only@localhost:5432/exposed_ci
        run: |
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features --features postgres,rustls,sqlx-toml
          sqlx migrate run --config sqlx.toml --source db/migrations
          cargo sqlx prepare --check --workspace -- --bin exposed
      - name: Test release retries and collisions
        run: python3 scripts/test-publish-release.py
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Recover release reservation
        id: release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/publish-release.py prepare
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: build
        if: steps.release.outputs.digest == ''
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          load: ${{ github.event_name == 'pull_request' }}
          provenance: ${{ github.event_name == 'push' && 'mode=max' || 'false' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.release.outputs.image || 'exposed' }}:run-${{ github.run_id }}
          cache-from: type=gha,scope=exposed-linux-amd64
          cache-to: type=gha,scope=exposed-linux-amd64,mode=max
      - name: Smoke test the runtime image
        if: steps.release.outputs.digest == ''
        env:
          IMAGE: ${{ steps.release.outputs.image || 'exposed' }}:run-${{ github.run_id }}
          DATABASE_URL: postgresql://exposed:ci-only@localhost:5432/exposed_ci
        run: |
          docker run --rm "$IMAGE" --help
          docker run --detach --name exposed-smoke --network host --env DATABASE_URL "$IMAGE"
          trap 'docker logs exposed-smoke; docker rm --force exposed-smoke' EXIT
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            --max-time 5 --retry-max-time 45 \
            'http://127.0.0.1:6999/search?term=smoke&max_entries=1' --output /tmp/search.json
          python3 -c 'import json; assert json.load(open("/tmp/search.json")) == {"entities": []}'

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish timestamp image and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
        run: python3 scripts/publish-release.py publish --digest "$IMAGE_DIGEST"
