<div id="exposed-colour-study" data-palette="purple">
  <style>
    #exposed-colour-study {
      --exposed-surround: #000000;
      --exposed-surface: #111111;
      --exposed-text: #f0edf3;
      --exposed-secondary: #ada6b4;
      --exposed-accent: #a863d6;
      --exposed-line: #2a272f;
      font-family: "Avenir Next", Avenir, "Segoe UI", sans-serif;
      color: var(--exposed-text);
      width: 100%;
    }
    #exposed-colour-study[data-palette="red"] {
      --exposed-accent: #e84b5b;
    }
    #exposed-colour-study * { box-sizing: border-box; }
    #exposed-colour-study .palette-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 14px;
    }
    #exposed-colour-study .palette-control {
      appearance: none;
      font: 500 14px/1.4 "Avenir Next", Avenir, "Segoe UI", sans-serif;
      border: 1px solid #a863d6;
      border-radius: 6px;
      padding: 10px 18px;
      background: #000000;
      color: #f0edf3;
      cursor: pointer;
    }
    #exposed-colour-study .palette-control[data-choice="red"] {
      border-color: #e84b5b;
    }
    #exposed-colour-study .palette-control[aria-pressed="true"] {
      background: #24122f;
      text-decoration: underline;
      text-underline-offset: 5px;
      text-decoration-thickness: 2px;
    }
    #exposed-colour-study .palette-control[data-choice="red"][aria-pressed="true"] {
      background: #2d1018;
    }
    #exposed-colour-study .search-preview {
      background: var(--exposed-surround);
      padding: 30px 34px 40px;
      border-radius: 12px;
    }
    #exposed-colour-study .preview-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 32px;
    }
    #exposed-colour-study .wordmark {
      font-size: 24px;
      line-height: 1.2;
      font-weight: 500;
      letter-spacing: -1px;
    }
    #exposed-colour-study .sample-label {
      color: var(--exposed-secondary);
      font-size: 12px;
      line-height: 1.4;
    }
    #exposed-colour-study .query-label {
      display: block;
      margin-bottom: 14px;
      font-size: 25px;
      line-height: 1.3;
      font-weight: 500;
      letter-spacing: -0.6px;
    }
    #exposed-colour-study .query-field {
      display: flex;
      align-items: center;
      gap: 14px;
      background: var(--exposed-surface);
      border: 1px solid var(--exposed-accent);
      border-radius: 7px;
      padding: 16px 18px;
    }
    #exposed-colour-study .query-field svg {
      width: 20px;
      height: 20px;
      flex: 0 0 20px;
      color: var(--exposed-accent);
    }
    #exposed-colour-study .query-field input {
      appearance: none;
      min-width: 0;
      width: 100%;
      padding: 0;
      border: 0;
      border-radius: 0;
      color: var(--exposed-text);
      background: var(--exposed-surface);
      font: 400 22px/1.4 "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }
    #exposed-colour-study .results-heading {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
      margin: 24px 0 10px;
      color: var(--exposed-secondary);
      font-size: 13px;
      line-height: 1.4;
    }
    #exposed-colour-study .matches {
      list-style: none;
      background: var(--exposed-surround);
      padding: 0;
      margin: 0;
    }
    #exposed-colour-study .match {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 12px 20px;
      padding: 21px 0;
    }
    #exposed-colour-study .match + .match {
      border-top: 1px solid var(--exposed-line);
    }
    #exposed-colour-study .entity-name {
      font-size: 17px;
      line-height: 1.5;
      font-weight: 400;
      overflow-wrap: anywhere;
    }
    #exposed-colour-study mark {
      background: transparent;
      color: var(--exposed-accent);
      font-weight: 500;
    }
    #exposed-colour-study .entity-type {
      color: var(--exposed-secondary);
      font-size: 12px;
      line-height: 1.5;
    }
    #exposed-colour-study .palette-announcement {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    @media (max-width: 480px) {
      #exposed-colour-study .search-preview { padding: 24px 18px; }
      #exposed-colour-study .preview-header { margin-bottom: 26px; }
      #exposed-colour-study .query-label { font-size: 22px; }
      #exposed-colour-study .match { grid-template-columns: minmax(0, 1fr); gap: 4px; padding: 16px 0; }
    }
  </style>
  <div class="palette-controls" role="group" aria-label="Search colour study">
    <button class="palette-control" type="button" data-choice="purple" aria-pressed="true">Purple accent</button>
    <button class="palette-control" type="button" data-choice="red" aria-pressed="false">Red accent</button>
  </div>
  <section class="search-preview" aria-label="Search preview with illustrative results">
    <div class="preview-header">
      <span class="wordmark">Exposed</span>
      <span class="sample-label">Illustrative results</span>
    </div>
    <label class="query-label" for="exposed-study-query">Search MPs and funders</label>
    <div class="query-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
        <circle cx="10.5" cy="10.5" r="6.5"></circle>
        <path d="m15.5 15.5 5 5"></path>
      </svg>
      <input id="exposed-study-query" type="text" value="hart" readonly aria-label="Illustrative search query">
    </div>
    <div class="results-heading"><span>4 results shown</span><span>Best matches first</span></div>
    <ul class="matches" aria-label="Illustrative search results">
      <li class="match"><span class="entity-name">Harriet <mark>Hart</mark>well</span><span class="entity-type">MP</span></li>
      <li class="match"><span class="entity-name"><mark>hart</mark>well group ltd</span><span class="entity-type">Company</span></li>
      <li class="match"><span class="entity-name">daniel <mark>hart</mark>well</span><span class="entity-type">Individual funder</span></li>
      <li class="match"><span class="entity-name"><mark>hart</mark>well workers union</span><span class="entity-type">Trade union</span></li>
    </ul>
  </section>
  <span class="palette-announcement" aria-live="polite">Purple accent palette</span>
  <script>
    (() => {
      const root = document.getElementById('exposed-colour-study');
      const buttons = root.querySelectorAll('[data-choice]');
      const announcement = root.querySelector('.palette-announcement');
      buttons.forEach((button) => {
        button.addEventListener('click', () => {
          root.dataset.palette = button.dataset.choice;
          buttons.forEach((candidate) => {
            candidate.setAttribute('aria-pressed', String(candidate === button));
          });
          announcement.textContent = button.textContent + ' palette';
        });
      });
    })();
  </script>
</div>
