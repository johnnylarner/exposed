[package]
name = "weldrs-comparison"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[features]
splink-simd = ["weldrs/simd"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
polars = { version = "=0.53.0", default-features = false, features = ["lazy", "strings", "regex", "dtype-i8", "dtype-i16", "dtype-struct"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
strum = { version = "0.28", features = ["derive"] }
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["serde", "v7"] }
weldrs = "=0.2.2"

[profile.dev]
debug = 0
