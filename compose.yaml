name: exposed
services:
  exposed:
    build:
      context: .
      dockerfile: docker/Dockerfile.dev
    init: true
    working_dir: /app
    command:
      - cargo
      - watch
      - --poll
      - --watch
      - exposed
      - --watch
      - Cargo.toml
      - --watch
      - Cargo.lock
      - --exec
      - run --package exposed --bin exposed -- exposed/config/compose.yaml
    environment:
      DATABASE_URL: postgresql://exposed:exposed_local_dev@postgres:5432/exposed?sslmode=disable
      RUST_BACKTRACE: "1"
      EXPOSED_IMPORT_TOKEN: ${EXPOSED_IMPORT_TOKEN:-exposed_local_import}
    ports:
      - "127.0.0.1:6999:6999"
      - "127.0.0.1:7000:7000"
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: exposed
      POSTGRES_PASSWORD: exposed_local_dev
      POSTGRES_DB: exposed
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exposed -d exposed"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
  cargo_registry:
  cargo_git:
  cargo_target:
