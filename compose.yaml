name: exposed
services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    init: true
    environment:
      EXPOSED_API_ORIGIN: http://exposed:6999
      EXPOSED_WATCH_POLL: "true"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app/frontend
      - frontend_node_modules:/app/frontend/node_modules
    depends_on:
      exposed:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 20s
      retries: 10
  exposed:
    build:
      context: ./docker
      dockerfile: Dockerfile.dev
    init: true
    working_dir: /app
    command:
      - cargo
      - watch
      - --poll
      - --watch
      - exposed
      - --watch
      - Cargo.toml
      - --watch
      - Cargo.lock
      - --exec
      - run --package exposed --bin exposed -- exposed/config/compose.yaml
    environment:
      DATABASE_URL: postgresql://exposed:exposed_local_dev@postgres:5432/exposed?sslmode=disable
      RUST_BACKTRACE: "1"
    ports:
      - "127.0.0.1:6999:6999"
    volumes:
      - .:/app
      - cargo_registry:/usr/local/cargo/registry
      - cargo_git:/usr/local/cargo/git
      - cargo_target:/app/target
    depends_on:
      postgres:
        condition: service_healthy
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: exposed
      POSTGRES_PASSWORD: exposed_local_dev
      POSTGRES_DB: exposed
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exposed -d exposed"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  frontend_node_modules:
  postgres_data:
  cargo_registry:
  cargo_git:
  cargo_target:
