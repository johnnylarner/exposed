name: exposed
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exposed
      POSTGRES_PASSWORD: exposed_local_dev
      POSTGRES_DB: exposed
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exposed -d exposed"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  postgres_data:
