[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "exposed"
version = "0.1.0"
description = "Parliament API client for the Exposed Rust application"
requires-python = ">=3.14"
dependencies = [
  "httpx>=0.28,<0.29",
  "python-dotenv>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=9,<10", "ruff>=0.14,<1", "pyright>=1.1,<2"]

[project.scripts]
exposed = "exposed.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: uses a dedicated PostgreSQL test database"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["src", "tests", "scripts"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
