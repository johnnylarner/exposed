[package]
name = "exposed"
version = "0.1.0"
edition = "2024"
readme = "README.md"
description = "Application that makes UK parliament data easy to search"
license.workspace = true 
categories.workspace = true 
keywords.workspace = true 
repository.workspace = true 


[lib]
path = "src/lib/lib.rs"

[lints]
workspace = true

[[bin]]
name = "exposed"
path = "src/bin/main.rs"


[dependencies]
anyhow = "1.0.104"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
httpdate = "1.0.3"
parquet = { version = "60.0.0", default-features = false, features = ["arrow", "snap"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rust-yaml = { version = "1.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_path_to_error = "0.1.20"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio","uuid", "chrono", "bigdecimal"] }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
thiserror = "2.0.20"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "signal"] }
uuid = { version = "1.23.0", features = ["v7", "serde"] }

[dev-dependencies]
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "migrate"] }
