[package]
name = "exposed"
version = "0.1.0"
edition = "2024"

[lib]
path = "src/lib/lib.rs"

[[bin]]
name = "exposed"
path = "src/bin/main.rs"


[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10"
bigdecimal = { version = "0.4.10", features = ["serde"] }
uuid = { version = "1.23.0", features = ["v4", "serde"] }
clap = { version = "4.6.7", features = ["derive"] }
rust-yaml = { version = "1.1.0", features = ["serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["arbitrary_precision"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "uuid", "chrono", "bigdecimal"] }
strum = { version = "0.28.0", features = ["derive", "strum_macros"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "process", "io-util", "signal", "sync", "time"] }
reqwest = { version = "0.13.5", features = ["json"] }

[dev-dependencies]
reqwest = "0.13.5"
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "migrate"] }
